# CI -- runs the exact same command a stranger runs locally: ./run_tests.sh.
# That script itself runs every pytest suite in the tree PLUS the examples/
# planted-failure checks, and treats a suite that collects/asserts zero
# tests as a failure, not a pass -- see run_tests.sh's own header comment.
#
# This job must be able to go red. There is no `continue-on-error`, no
# `|| true`, and no step that swallows run_tests.sh's exit code -- a CI job
# that cannot fail would be exactly the defect this whole repo exists to
# make loud, shipped in its own CI.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: run_tests.sh (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor this repo declares for itself (see
        # .claude/hooks/check_interpreter_floor.py and the header comment
        # in .claude/hooks/_common.py: a module-level PEP-604 union
        # annotation raises TypeError at import below 3.10, which the
        # Claude Code hook protocol treats as a silent, non-blocking
        # PERMIT -- every guard fails open under it). 3.11 and 3.13 round
        # out a small matrix without turning this into a full CPython
        # support-grid job.
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install jq (protect-files.sh and examples/ both need it)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pip pytest pyyaml

      - name: Run the full suite
        run: ./run_tests.sh

  # scripts/check_escape_markers.py audits every escape marker ADDED in a
  # pull request's diff (see that script's own module docstring for the
  # full doctrine) -- a reasoned marker that isn't named in an
  # Escape-Markers: commit trailer, or any bare marker, fails this job. No
  # continue-on-error, same rule as the `test` job above: a gate that
  # cannot fail is the defect this repo exists to make loud.
  #
  # PULL REQUESTS have a real base to diff against
  # (github.event.pull_request.base.sha) and are BLOCKING. A push event
  # (e.g. a direct push to main, or the push half of a PR's own
  # synchronize) has no PR base ref at all -- this job NO-OPS LOUDLY for
  # that case (a named, visible step that explains why nothing ran)
  # instead of either fabricating a base ref that doesn't mean what a PR
  # diff means, or silently skipping without a trace in the job list.
  escape-markers:
    name: check_escape_markers.py
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, not a shallow clone: the gate needs to diff
          # against the PR's base sha and walk every commit in between for
          # Escape-Markers: trailers -- a shallow checkout can leave that
          # base sha unreachable.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Audit escape markers added in this pull request
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_escape_markers.py --base-ref "${{ github.event.pull_request.base.sha }}"

      - name: No PR base to diff against on a push event -- no-op, loudly
        if: github.event_name != 'pull_request'
        run: |
          echo "check_escape_markers.py: event '${{ github.event_name }}' has no PR base ref to diff against -- skipping intentionally, not a failure. This gate only runs on pull_request."
